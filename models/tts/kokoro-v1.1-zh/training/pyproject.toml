[project]
name = "kokoro-zh-training"
version = "0.1.0"
description = "Real-data bilingual Kokoro PyTorch training, verified weights, and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro",
    "torch==2.11.0+cu130",
    "transformers==4.57.6",
    "numpy==2.2.6",
    "soundfile==0.13.1",
    "jsonschema==4.26.0",
    "misaki[zh]==0.9.4",
    "scipy==1.17.1",
    "librosa==0.11.0",
    "pypdf==6.0.0",
    "jiwer==4.0.0",
    "en-core-web-sm",
    "opencc-python-reimplemented==0.1.7",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.12.12"]

[project.scripts]
kokoro-readiness = "kokoro_training.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kokoro_training"]

[tool.uv.sources]
kokoro = { git = "https://github.com/hexgrad/kokoro", rev = "dfb907a02bba8152ca444717ca5d78747ccb4bec" }
torch = { index = "pytorch-cu130" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
