[project]
name = "cosyvoice3-coreml"
version = "0.1.0"
description = "CosyVoice3 TTS CoreML conversion"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "coremltools>=8.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.20.0",
    "torchaudio>=2.0.0",
    "scipy>=1.10.0",
    "openai-whisper>=20231117",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0,<1.24.0",  # 1.24+ requires Python 3.11+
    "transformers>=4.30.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "onnx-coreml>=1.3",
    "einops>=0.7.0",
]
