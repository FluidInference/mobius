[project]
name = "cosyvoice3-coreml"
version = "0.1.0"
description = "CosyVoice3 TTS CoreML conversion"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "coremltools>=8.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.20.0",
    "torchaudio>=2.0.0",
    "scipy>=1.10.0",
    "openai-whisper>=20231117",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0,<1.24.0",  # 1.24+ requires Python 3.11+
    "transformers>=4.30.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "onnx-coreml>=1.3",
    "einops>=0.7.0",
    "gdown>=5.0.0",
    "HyperPyYAML>=1.2.0",
    "modelscope>=1.20.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "inflect>=7.3.0",
    "conformer>=0.3.0",
    "lightning>=2.2.0",
    "x-transformers>=2.11.0",
    "diffusers>=0.29.0",
    "networkx>=3.1",
    "pyworld>=0.3.4",
    "protobuf>=4.25",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
    "wget>=3.2",
    "pyarrow>=18.0.0",
    "wetext>=0.0.4",
    "rich>=13.0.0",
]
