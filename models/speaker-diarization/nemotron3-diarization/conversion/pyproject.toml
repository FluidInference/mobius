[project]
name = "nemotron3-diarization-coreml"
version = "0.1.0"
description = "CoreML conversion of NVIDIA Nemotron 3 Diarization preview (8-spk streaming Sortformer)"
requires-python = ">=3.12"
dependencies = [
    # NeMo Speech main is required: the RoPE TransformerEncoder is not in any PyPI release
    # (nemo-toolkit 3.0.0 lacks self_attention_model='rope').
    "nemo-toolkit[asr] @ git+https://github.com/NVIDIA-NeMo/Speech.git",
    # coremltools 9.0 torch frontend breaks with numpy>=2 ("only 0-dimensional arrays can
    # be converted to Python scalars" on every shape-unpack) and is only tested to torch 2.7.
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "coremltools==9.0",
    "soundfile>=0.12",
]

# NeMo Speech main pins `torch` to per-platform indexes; uv refuses to resolve unless the
# root project declares the same mapping. On darwin both land on PyPI, which is what we want.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'darwin'" },
  { index = "pypi", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
