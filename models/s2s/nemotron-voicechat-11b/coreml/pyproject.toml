[project]
name = "nemotron-voicechat-11b-coreml"
version = "0.1.0"
description = "Slice + convert NVIDIA NemotronLabs VoiceChat 11B for Apple Silicon (CoreML + MLX)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.12.1",
    "safetensors>=0.4.0",
    "numpy==2.2.6",
    "coremltools>=8.0",
    "typer>=0.9.0",
    "nemo_toolkit[asr]>=2.0.0",
    "soundfile>=0.12.0",
]

[tool.uv]
dev-dependencies = []
