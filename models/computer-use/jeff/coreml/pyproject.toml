[project]
name = "jeff-coreml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "coremltools==9.0",
  "gliformer==0.1.2",
  "jeff @ git+https://github.com/logan-markewich/jeff.git@34b32f99a727c47b679adde33f4702a001e02979",
  "numpy>=2.5.3",
  "torch==2.7.0",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
