[project]
name = "decision-kai-coreml"
version = "0.1.0"
description = "Pinned Kai native decision model to Core ML"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools==9.0",
    "huggingface-hub==0.36.2",
    "numpy>=1.26,<2.3",
    "safetensors==0.6.2",
    "torch==2.7.0",
    "transformers==4.57.6",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]
