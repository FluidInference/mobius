[project]
name = "lfm350-rlcd-coreml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.15.0",
  "coremltools==9.0",
  "jsonschema>=4.25",
  "numpy>=2.5.3",
  "torch==2.7.0",
  "transformers==5.16.1",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
