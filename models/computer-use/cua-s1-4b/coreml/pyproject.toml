[project]
name = "cua-s1-4b-coreml"
version = "0.1.0"
description = "Cua-S1-4B-0.2 (Qwen3.5-4B + LoRA) Core ML conversion and parity verification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools==9.0",
    "huggingface-hub>=0.34",
    "numpy<2.3",
    "peft>=0.18.1",
    "pillow>=11",
    "safetensors>=0.5",
    "tokenizers>=0.21",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# safetensors' safe_open exposes keys() but is not a dict
ignore = ["SIM118"]
